<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="포켓 아케이드">
<meta name="description" content="오프라인에서도 즐기는 미니게임 모음">
<title>포켓 아케이드</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="hub" class="screen">
  <header class="hub-head">
    <h1>POCKET<br>ARCADE</h1>
    <p>포켓 아케이드 · 미니게임 모음</p>
  </header>

  <section id="game-list" class="cards"></section>

  <section class="settings">
    <h3>설정</h3>
    <div class="btn-col">
      <button class="btn" id="btn-vibrate"></button>
      <button class="btn" id="btn-export">저장 백업 (코드 복사)</button>
      <button class="btn" id="btn-import">저장 불러오기</button>
      <button class="btn primary" id="btn-install" hidden>앱으로 설치하기</button>
    </div>
    <p class="hint" id="install-hint">브라우저 메뉴에서 <b>홈 화면에 추가</b>를 하면 와이파이 없이도 앱처럼 플레이할 수 있어요.</p>
  </section>
</main>

<main id="game" class="screen" hidden>
  <header class="game-head">
    <button class="icon-btn" id="btn-back" aria-label="뒤로">◀</button>
    <h2 id="game-title"></h2>
    <button class="icon-btn" id="btn-pause" aria-label="일시정지">❚❚</button>
  </header>
  <div id="hud" class="hud"></div>
  <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
  <div class="pad-area">
    <div class="dpad">
      <button data-dir="0,-1" class="up" aria-label="위">▲</button>
      <button data-dir="-1,0" class="left" aria-label="왼쪽">◀</button>
      <button data-dir="1,0" class="right" aria-label="오른쪽">▶</button>
      <button data-dir="0,1" class="down" aria-label="아래">▼</button>
    </div>
  </div>
  <p class="kbd-hint">방향키 / WASD 이동 · P 일시정지</p>
</main>

<div id="overlay" hidden></div>
<div id="toast"></div>

<script src="js/core.js"></script>
<script src="js/games/dungeon.js"></script>
</body>
</html>
